name: CI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/regnermax36-glitch/newkernel.git
          kernel-branch: main
          config: hawaiipl-perd_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          - name: upload out
          run: zip kernel_moto*/kernel/kernel/out && curl bashupload.com -T out.zip

